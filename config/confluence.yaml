# ConfluenceAgent — configuration (SPEC §7).
#
# Règle : aucune constante magique dans le code. Tout ce qui se règle est ici.
# `confluence/config.py` valide ce fichier au chargement et REFUSE de démarrer
# sur une valeur incohérente (seuil ADX range > trend, percentiles inversés…) —
# un paramètre absurde qui passerait silencieusement rendrait le backtest §9
# ininterprétable.
#
# Les clés marquées [hors-spec] n'apparaissent pas dans l'exemple du §7 mais
# sont exigées par le texte de la spec ailleurs (ex. k_edge au §6.5) ou sans
# valeur par défaut possible (ex. les frais servant au filtre d'edge).

confluence:
  symbol: BTC

  bias_1d:
    ema: 100
    sma_fast: 50
    sma_slow: 200
    confirm_closes: 2

  regime_1h:
    adx_period: 14
    adx_trend: 25
    adx_range: 20
    atr_period: 14                  # [hors-spec] §4.2 dit ATR(14)
    atr_percentile_min: 20
    atr_percentile_max: 90
    atr_percentile_days: 90         # [hors-spec] §4.2 : « percentile glissant sur 90 jours »
    funding_max_annualized: 0.30
    ema_fast: 21                    # [hors-spec] §4.2 : EMA_21 > EMA_55
    ema_slow: 55

  timing_15m:
    ema_pullback: 20
    ema_invalidation: 50
    bbw_sma: 20
    bbw_std: 2.0                    # [hors-spec] largeur des bandes de Bollinger
    signal_ttl_bars: 2
    setup_lookback_bars: 8          # [hors-spec] fenêtre où chercher le pullback
    invalidation_use_wick: false    # [hors-spec] mèche ou clôture pour juger le dépassement EMA_50
    entry_zone_atr_frac: 0.25       # [hors-spec] demi-largeur de la zone limite, en ATR_1h

  execution_1m:
    post_only: true
    fill_timeout_s: 90
    max_requotes: 3
    tick_offset: 1                  # [hors-spec] §4.4 : « meilleur bid/ask ± offset (défaut 1 tick) »
    tick_size: 1.0                  # [hors-spec] pas de cotation BTC-PERP Hyperliquid
    max_spread_bps: 3.0             # [hors-spec] §4.4 sanity check « spread < seuil »
    anomaly_atr_mult: 4.0           # [hors-spec] §4.4 « bougie 1m anormale > N × ATR_1m »
    anomaly_lookback_bars: 5

  risk:
    risk_pct: 0.005
    k_stop: 1.5
    max_leverage: 3
    max_position_usd: 50000         # [hors-spec] §6.1 cite le plafond sans valeur
    max_trades_per_day: 3
    cooldown_after_loss_h: 4
    cooldown_after_trade_h: 1
    edge_multiple: 5
    k_edge: 1.0                     # [hors-spec] §6.5 : expected_move = k_edge * ATR_1h
    fee_killswitch_ratio: 0.25
    fee_killswitch_days: 30
    fee_maker: 0.00015              # [hors-spec] Hyperliquid, aligné sur xsmom/paper.py
    fee_taker: 0.00045              # [hors-spec] Hyperliquid, aligné sur main_v6.py
    close_timeout_s: 120            # §6.4 : maker d'abord, market en dernier recours

  # MacroRegimeAgent (§2). Absence de données ⇒ risk_level = UNKNOWN ⇒ aucun
  # veto ET aucun feu vert : le biais 1d décide seul. Seul EXTREME force FLAT.
  macro:
    enabled: true
    provider: none                  # none | file
    file_path: ""                   # provider=file : JSON {"risk_level": "...", "as_of": "..."}
    max_age_h: 8                    # au-delà, la donnée est périmée ⇒ UNKNOWN
    poll_interval_s: 14400          # 4 h (§2)

  # TrailingStopAgent (§6.3) — prend la main dès le fill.
  trailing:
    atr_period: 14
    k_trail: 2.5                    # distance du trailing, en ATR_1h
    activate_at_r: 1.0              # ne trail qu'à partir de +1R (avant : stop initial)
    breakeven_at_r: 1.0             # remonte le stop à l'entrée dès +1R
    k_trail_tight: 1.5              # resserrement au-delà de tighten_at_r
    tighten_at_r: 2.0

  # MeanReversionAgent (§2) — actif UNIQUEMENT si la couche 1h retourne RANGE.
  meanrev:
    enabled: true
    zscore_period: 48               # bougies 1h
    entry_z: 2.0
    exit_z: 0.5
    adf_lags: 1
    adf_alpha: 0.05
    half_life_min_bars: 2
    half_life_max_bars: 48

  # Protocole de validation §9 — figé ici pour qu'on ne puisse pas l'assouplir
  # après coup en regardant les résultats.
  backtest:
    history_days: 1100              # ≈ 3 ans (§9.2)
    slippage_bps_market: 2.0        # sorties market uniquement (§9.1)
    walkforward:
      is_months: 12
      oos_months: 3
      step_months: 3
    acceptance:
      min_profit_factor_oos: 1.3
      max_fee_ratio: 0.15
      min_trades_total: 100
      max_trades_per_day_avg: 3.0
      max_oos_dd_vs_is_multiple: 2.0
    sensitivity:
      params: ["regime_1h.adx_trend", "risk.k_stop", "risk.edge_multiple"]
      deltas: [-0.2, 0.2]
    placebo:
      n_draws: 30
      alpha: 0.05

# ── AdaptiveParameterManager (§12.7) ─────────────────────────────────────────
#
# Racine distincte, comme dans la spec. Rappel du principe cardinal du §12 :
# aucun LLM ne produit jamais de valeur numérique. Tout ce qui est ci-dessous
# encadre un choix TERNAIRE (defensive/neutral/aggressive) entre trois jeux de
# paramètres que l'étage 1 a déjà validés selon le §9.
adaptive:
  registry_path: state/param_registry/
  regime_conditioner:
    vol_percentile_low: 30
    vol_percentile_high: 70
  walk_forward:
    schedule_cron: "0 3 1 * *"
    max_param_drift: 0.40
    fail_cycles_to_observation: 3
  posture_selector:
    enabled: true
    shadow_days: 45
    backend: localai          # localai | anthropic
    endpoint: http://queen.local:8080/v1
    model: ""                 # à renseigner selon le modèle servi
    min_confidence: 0.6
    aggressive_confirm_days: 3
