# V7 — Configuration d'allocation dynamique multi-stratégies
# Voir core/config.py pour la validation typée.

# ─── Symboles tradés ──────────────────────────────────────────────────────────
symbols:
  - BTC
  - ETH
  - SOL
  - BNB
  - AAVE
  - LINK
  - SUI
  - DOGE

# ─── Détecteur de régime ──────────────────────────────────────────────────────
regime:
  window_bars: 100               # fenêtre features (100 bars 1h = 4j)
  min_dwell_bars: 8              # hystérésis (8h)
  timeframe: 1h
  high_vol_atr_percentile: 0.85  # ATR > p85 sur la fenêtre → HIGH_VOL

# ─── Allocateur ───────────────────────────────────────────────────────────────
allocation:
  # Matrice B[régime][stratégie] : poids de base.
  # 2026-06-02 — EXCLUSIF : une seule stratégie active par régime (les stratégies
  # se remplacent sur le wallet partagé, hystérésis sur le label). Évite que
  # plusieurs stratégies tradent le même compte netté → tue le szi=0/frozen.
  #   range    → mean_reversion (la plus prometteuse en range)
  #   high_vol → grille (pas serrés + renouvellement rapide, encadré sécurité)
  #   trends   → supertrend (suit la tendance)
  #   momentum → off pour l'instant
  base_weights:
    trend_up:
      grid: 0.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 1.0
    trend_down:
      grid: 0.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 1.0
    range:
      # 2026-06-07 — range partagé avec PRIORITÉ MR (décision francois) :
      # la grille moissonne le range par défaut ; dès que MR a un setup
      # (|z|≥entry_z, hl valide) sur un symbole, la grille y est PRÉEMPTÉE
      # (flat + cancel) et MR entre avec sa taille/levier propres.
      # Exclusivité par symbole préservée (jamais les deux sur le même coin).
      # NB : grid reste à 0.0 ICI car la grille est hors allocateur (elle gère
      # son book via sa FSM) — poids MR plein = taille MR intacte (pas de
      # division par la normalisation). Le budget grille en range est gouverné
      # par strategies.grid.range_budget_frac.
      grid: 0.0
      mean_reversion: 1.0
      momentum: 0.0
      supertrend: 0.0
    high_vol:
      grid: 1.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 0.0

  # Multiplicateur de performance — borné, lent.
  mult_min: 0.3                 # plancher : stratégie en perte n'est pas coupée
  mult_max: 1.5                 # plafond : pas de chasing du momentum perf
  perf_halflife_days: 45        # demi-vie EMA scoring

  # Vol-targeting par stratégie
  vol_target: 0.10              # vol annualisée cible

# ─── Risk Manager ─────────────────────────────────────────────────────────────
risk:
  max_gross_exposure_pct: 2.0   # gross max = 2× equity
  max_per_asset_pct: 0.4        # par actif max = 40% equity
  kill_switch_dd_pct: 0.10      # -10% DD → kill switch
  daily_loss_limit_pct: 0.03    # -3% jour → flat
  high_lev_emergency_exempt: true   # Fix 10 Knob A activé (boucle HYPE 10x)
  manual_symbols: ["HYPE", "BTC"]   # 2026-06-07 : positions manuelles francois —
                                    # jamais d'orphan force-close ni de boot-load
                                    # (le reconcile les solderait). Retirer BTC
                                    # quand le swing manuel sera clos.

# ─── Execution ────────────────────────────────────────────────────────────────
execution:
  paper_mode: false              # LIVE — cutover 2026-05-31
  rebalance_threshold_pct: 0.005 # bande non-trade 0.5% du gross
  dashboard_port: 8082          # 8082 paper, 8081 live (cutover P8)
  exec_bandit_active: false      # bandit exécution OFF — activer quand ≥500 fills
                                 # shadow ET ≥1 bps/ordre d'économie (exec_bandit_shadow.py --report)

# ─── Stratégies (paramètres par stratégie) ────────────────────────────────────
strategies:
  grid:
    enabled: true
    atr_factor: 0.5
    levels: 5
    notional_per_level_usdc: 15.0
    bias_momentum_pct: 0.01       # 2026-06-07 : |mom 24h| > 1% → grille biaisée
                                  # (long-only en hausse, short-only en baisse)
    drift_k: 3.0
    drift_window_sec: 600         # 2026-06-07 : 900→600. 42 DRIFT/0 BREAKOUT/0 désact
                                  # en range, équity en baisse → lâcher les mini-trends
                                  # plus vite. (2026-06-01 : 3600→900, cas BNB rallye)
    health_check_sec: 30          # 2026-06-02 : 300→30, renouvellement rapide des
                                  # niveaux 'done' (grille high_vol = récolte oscillation)
    activation_threshold_usdc: 20.0
    frozen_timeout_sec: 600       # fix port V6 28/05 : G2 frozen state
    min_spacing_ticks: 2          # garde bas-prix (DOGE) : niveaux distincts
    min_spacing_pct: 0.001        # plancher anti-frais : step ≥ 0.10% du prix
    high_vol_atr_factor: 0.25     # high_vol : pas resserrés (÷2 vs 0.5 normal)
    fast_loop_enabled: true       # thread grille dédié (port V6) : pilote la FSM
    fast_loop_sec: 3              # à cadence rapide → évite l'épidémie szi=0/frozen

  mean_reversion:
    enabled: true
    interval: 1h
    window: 50
    entry_z: 1.5             # 2.0→1.5 pour P7 observation (plus de trades)
    exit_z: 0.4
    hl_min: 5.0
    hl_max: 48.0
    cooldown_sec: 1800
    notional_usdc: 200.0
    sl_z: 3.5
    min_sl_buffer_std: 1.5

  momentum:
    enabled: true
    interval: 1h
    lookback_bars: 48
    entry_zscore: 1.0        # 1.5→1.0 pour P7 observation
    notional_usdc: 200.0

  supertrend:
    enabled: true
    interval: 1h
    period: 10
    multiplier: 3.0
    risk_per_trade_pct: 0.01      # 1% equity de risque max par trade
    notional_max_usdc: 500.0
    notional_min_usdc: 10.0
    cooldown_sec: 900

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:
  data_historical: data/historical
  memory: memory
  logs: logs
