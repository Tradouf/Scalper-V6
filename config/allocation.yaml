# V7 — Configuration d'allocation dynamique multi-stratégies
# Voir core/config.py pour la validation typée.

# ─── Symboles tradés ──────────────────────────────────────────────────────────
symbols:
  - BTC
  - ETH
  - HYPE
  - SOL
  - ZEC
  - XRP
  - TAO
  - BNB
  - AAVE
  - LINK
  - SUI
  - DOGE
  
  

# ─── Détecteur de régime ──────────────────────────────────────────────────────
regime:
  window_bars: 100               # fenêtre features (100 bars 1h = 4j)
  min_dwell_bars: 8              # hystérésis (8h)
  timeframe: 1h
  high_vol_atr_percentile: 0.85  # ATR > p85 sur la fenêtre → HIGH_VOL

# ─── Allocateur ───────────────────────────────────────────────────────────────
allocation:
  # Matrice B[régime][stratégie] : poids de base.
  # 2026-06-02 — EXCLUSIF : une seule stratégie active par régime (les stratégies
  # se remplacent sur le wallet partagé, hystérésis sur le label). Évite que
  # plusieurs stratégies tradent le même compte netté → tue le szi=0/frozen.
  #   range    → mean_reversion (la plus prometteuse en range)
  #   high_vol → grille (pas serrés + renouvellement rapide, encadré sécurité)
  #   trends   → supertrend (suit la tendance)
  #   momentum → off pour l'instant
  base_weights:
    trend_up:
      grid: 0.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 1.0
      awesome_oscillator: 0.0    # hors allocateur (gère BTC en propre), poids 0 partout
      tsmom: 0.0              # hors allocateur (trend following 1d en propre), poids 0 partout
      rotation: 0.0           # hors allocateur (ensemble contrarian 1d), poids 0 partout
    trend_down:
      grid: 0.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 1.0
      awesome_oscillator: 0.0
      tsmom: 0.0              # hors allocateur (trend following 1d en propre), poids 0 partout
      rotation: 0.0           # hors allocateur (ensemble contrarian 1d), poids 0 partout
    range:
      # 2026-06-07 — range partagé avec PRIORITÉ MR (décision francois) :
      # la grille moissonne le range par défaut ; dès que MR a un setup
      # (|z|≥entry_z, hl valide) sur un symbole, la grille y est PRÉEMPTÉE
      # (flat + cancel) et MR entre avec sa taille/levier propres.
      # Exclusivité par symbole préservée (jamais les deux sur le même coin).
      # NB : grid reste à 0.0 ICI car la grille est hors allocateur (elle gère
      # son book via sa FSM) — poids MR plein = taille MR intacte (pas de
      # division par la normalisation). Le budget grille en range est gouverné
      # par strategies.grid.range_budget_frac.
      grid: 0.0
      mean_reversion: 1.0
      momentum: 0.0
      supertrend: 0.0
      awesome_oscillator: 0.0
      tsmom: 0.0              # hors allocateur (trend following 1d en propre), poids 0 partout
      rotation: 0.0           # hors allocateur (ensemble contrarian 1d), poids 0 partout
    high_vol:
      grid: 1.0
      mean_reversion: 0.0
      momentum: 0.0
      supertrend: 0.0
      awesome_oscillator: 0.0
      tsmom: 0.0              # hors allocateur (trend following 1d en propre), poids 0 partout
      rotation: 0.0           # hors allocateur (ensemble contrarian 1d), poids 0 partout

  # Multiplicateur de performance — borné, lent.
  mult_min: 0.3                 # plancher : stratégie en perte n'est pas coupée
  mult_max: 1.5                 # plafond : pas de chasing du momentum perf
  perf_halflife_days: 45        # demi-vie EMA scoring

  # Vol-targeting par stratégie
  vol_target: 0.10              # vol annualisée cible

# ─── Risk Manager ─────────────────────────────────────────────────────────────
risk:
  max_gross_exposure_pct: 2.0   # gross max = 2× equity
  max_per_asset_pct: 0.4        # par actif max = 40% equity
  kill_switch_dd_pct: 0.10      # -10% DD → kill switch
  daily_loss_limit_pct: 0.03    # -3% jour → flat
  high_lev_emergency_exempt: true   # Fix 10 Knob A activé (boucle HYPE 10x)
  manual_symbols: []                # 2026-06-13 : francois ne trade plus en manuel
                                    # sur ce compte → filet emergency normal restauré
                                    # sur tous les symboles (BTC inclus).

# ─── Execution ────────────────────────────────────────────────────────────────
execution:
  paper_mode: false              # LIVE — cutover 2026-05-31
  rebalance_threshold_pct: 0.005 # bande non-trade 0.5% du gross
  dashboard_port: 8082          # 8082 paper, 8081 live (cutover P8)
  exec_bandit_active: false      # bandit exécution OFF — activer quand ≥500 fills
                                 # shadow ET ≥1 bps/ordre d'économie (exec_bandit_shadow.py --report)

# ─── Gouverneur de risque LLM (2026-06-13) ────────────────────────────────────
# Adapte emergency_exit_roe_pct + taille des positions au régime, via LLM, à
# chaque cycle. Bornes DURES en code (emergency ∈ [3%,6%], size_mult ∈ [0.5,1.2]).
# Freins catastrophe (kill_switch, daily_loss_limit) restent hors de sa portée.
governor:
  enabled: true
  interval_sec: 900             # tactique : décision toutes les 15 min
  llm_endpoint: "http://localhost:8080"   # LocalAI (qwen, gratuit/rapide)
  llm_model: "qwen3.5-9b"
  # Étage STRATÈGE (Opus, lent, coût négligeable ~5s/appel) : pose l'enveloppe
  # (posture + bornes emergency/taille) que le tactique qwen respecte.
  strategist_enabled: true
  strategist_interval_sec: 3600  # 1h
  strategist_model: "opus"
  strategist_budget_usd: 0.5
  # Feeds contextuels (2026-06-14) injectés dans le prompt du stratège Opus :
  news_feed_enabled: true        # gros titres RSS (CoinDesk/Cointelegraph/Decrypt/TheBlock)
  onchain_feed_enabled: true     # flux whales Whale Alert (pression exchange)

# ─── Stratégies (paramètres par stratégie) ────────────────────────────────────
# 2026-06-20 — TOUT EN TSMOM (décision francois) : grid/MR/momentum/supertrend coupés
# (ne faisaient que saigner, cf. fills live −112$/20j). Seul le TSMOM trade désormais.
strategies:
  grid:
    enabled: false   # 2026-06-20 coupé (all-in TSMOM)
    atr_factor: 0.3
    levels: 5
    notional_per_level_usdc: 15.0
    bias_momentum_pct: 0.01       # 2026-06-07 : |mom 24h| > 1% → grille biaisée
                                  # (long-only en hausse, short-only en baisse)
    drift_k: 3.0
    drift_window_sec: 300         # 2026-06-09 21:00 : 600→300 (floor). 55 DRIFT (record)
                                  # /0 BREAKOUT/0 désact en range, équity en baisse
                                  # (-$6.92) → lâcher les mini-trends au plus vite.
                                  # (2026-06-07 : 900→600 ; 2026-06-01 : 3600→900)
    health_check_sec: 30          # 2026-06-02 : 300→30, renouvellement rapide des
                                  # niveaux 'done' (grille high_vol = récolte oscillation)
    activation_threshold_usdc: 12.0   # 2026-06-18 : 20→12. Le gouverneur défensif
                                      # (size_mult 0,8 × range_budget_frac 0,5 ÷ 12 syms
                                      # × equity ≈ 19,8$) tombait SOUS 20 → grilles
                                      # affamées ~20h (cliff de seuil). 12$ laisse de la
                                      # marge même si equity baisse / gouverneur resserre.
    frozen_timeout_sec: 600       # fix port V6 28/05 : G2 frozen state
    min_spacing_ticks: 2          # garde bas-prix (DOGE) : niveaux distincts
    min_spacing_pct: 0.001        # plancher anti-frais : step ≥ 0.10% du prix
    high_vol_atr_factor: 0.25     # high_vol : pas resserrés (÷2 vs 0.5 normal)
    fast_loop_enabled: true       # thread grille dédié (port V6) : pilote la FSM
    fast_loop_sec: 3              # à cadence rapide → évite l'épidémie szi=0/frozen

  mean_reversion:
    enabled: false   # 2026-06-20 coupé (all-in TSMOM)
    interval: 1h
    window: 50
    entry_z: 1.5             # 2.0→1.5 pour P7 observation (plus de trades)
    exit_z: 0.4
    hl_min: 5.0
    hl_max: 48.0
    cooldown_sec: 1800
    notional_usdc: 200.0
    sl_z: 3.5
    min_sl_buffer_std: 1.5

  momentum:
    enabled: false   # 2026-06-20 coupé (all-in TSMOM)
    interval: 1h
    lookback_bars: 48
    entry_zscore: 1.0        # 1.5→1.0 pour P7 observation
    notional_usdc: 200.0

  supertrend:
    enabled: false   # 2026-06-20 coupé (all-in TSMOM)
    interval: 1h
    period: 10
    multiplier: 3.0
    risk_per_trade_pct: 0.01      # 1% equity de risque max par trade
    notional_max_usdc: 500.0
    notional_min_usdc: 10.0
    cooldown_sec: 900

  # Awesome Oscillator (BTC 5m) — 2026-06-18. OFF par défaut : à backtester avant
  # tout live (cf. AO_STRATEGY_PLAN.md). Hors allocateur ; quand enabled=true, BTC
  # lui est RÉSERVÉ (retiré des autres stratégies + de la grille). x_long/x_short
  # = magnitudes (LONG si AO<−x_long, SHORT si AO>+x_short), auto-tunés en Phase 2.
  awesome_oscillator:
    enabled: false
    interval: 5m
    symbols:
      - BTC
    fast: 5
    slow: 34
    x_long: 65.0
    x_short: 60.0
    notional_usdc: 30.0
    tp_pct: 0.012               # TP = 2×SL (décision francois 2026-06-18) — à affiner au backtest
    sl_pct: 0.006              # SL géré : sans lui, le TP seul verrouille le book (backtest)

  # TSMOM — trend following 1d (2026-06-20). ACTIVÉ (décision francois). Hors allocateur :
  # ses symboles sont RÉSERVÉS (retirés des autres stratégies + grille) → grid/MR/momentum/
  # supertrend passent idle dessus (remplacement total voulu). Exempté de l'emergency exit
  # (tient des semaines), protégé par caps + kill-switch DD. HYPE/ZEC EXCLUS (manuels).
  # Univers réduit à 12 coins majeurs : à $536 d'equity les 41 coins tombent sous le min HL
  # $10/position (0/41 viables) ; 12 coins @ vol 20% = 12/12 viables ~$14 chacun. Élargir
  # quand l'equity grossit (~$2500+ pour les 41).
  tsmom:
    enabled: false   # 2026-06-21 — REMPLACÉ par la rotation (ensemble-contrarian, version
                     # diversifiée du même trend-following). Mutuellement exclusif sur les coins.
    interval: 1d
    symbols:
      - BTC
      - ETH
      - SOL
      - BNB
      - XRP
      - DOGE
      - LINK
      - AVAX
      - LTC
      - AAVE
      - SUI
      - ARB
    # NB 2026-06-20 : HYPE/ZEC/TAO PAS ajoutés — à $536 d'equity, 15 coins diluent le
    # sizing sous le min HL $10 (ZEC/HYPE trop volatils → flat de toute façon, et ça
    # ferait tomber AAVE sous $10). 12 coins = max viable. Leurs positions résiduelles
    # se ferment via reconcile (plus aucune stratégie ne les cible). Élargir si equity ≳$2500.
    lookback: 30                # ignoré quand lookbacks (ensemble) est fourni ci-dessous
    # ENSEMBLE multi-lookback ACTIVÉ 2026-06-20 (décision francois). Combine le signe sur 4
    # horizons (~2 sem→4 mois) → direction continue (conviction). Mesure honnête (split OOS,
    # 12 coins) : Sharpe ≈ inchangé (Δ dans le bruit) ; gains ROBUSTES = turnover −20..25%/an
    # (frais) et maxDD plus petit (14%→~9%). Au restart, les 12 positions se redimensionnent
    # par conviction (certaines réduites/flat si les horizons divergent).
    lookbacks: [15, 30, 60, 120]
    band: 0.0
    vol_win: 30
    target_vol_annual: 0.20     # ~12% maxDD, ~0,34× levier (choisir par tolérance DD)
    scalar_cap: 3.0
    max_gross_frac: 0.60        # garde-fou dur sur l'exposition brute
    refresh_sec: 1800           # refetch bougies 1d (anti-429) ; cible maintenue entre deux
    min_notional_usdc: 10.0     # sous ce notional/coin → flat (HL rejette < $10)

  # ROTATION — méta-allocateur ensemble-contrarian 1d (2026-06-21, ACTIVÉ décision francois).
  # Recherche project_strategy_rotation : la perf des stratégies est ANTI-persistante → tenir un
  # ensemble PROFOND (43 strat : trend/MR/vol/volume/chandelles/oscillateurs) et tilter DOUCEMENT
  # vers les perdants récents (softmax inverse-perf), vol-targeté comme le TSMOM. Validé walk-forward
  # (t-stat 4-5, robuste params) + vol-targeted (Sharpe portefeuille ~1,5 / maxDD 4% vs mono-TSMOM
  # 0,64/14%). Parité backtest exacte. Hors allocateur, REMPLACE le TSMOM sur les 12 coins.
  rotation:
    enabled: true
    interval: 1d
    pool: deep                  # 43 stratégies (vs 'base' 28)
    # Univers RÉDUIT à 8 coins (2026-06-21) : la conviction de l'ensemble-contrarian est
    # FRACTIONNAIRE (|méta|~0,2-0,4, vs ±1 du TSMOM) → à $535 d'equity, 12 coins mettent 11/12
    # sous le min HL $10 (1/12 actif = dormant). 8 coins → 5/8 actifs, gross ~$73 (0,14×). Élargir
    # vers 12 quand l'equity grossit (~$900+). Top-8 par liquidité.
    symbols:
      - BTC
      - ETH
      - SOL
      - BNB
      - XRP
      - DOGE
      - LINK
      - AVAX
    L: 90                       # fenêtre de scoring trailing (Sharpe par stratégie)
    temp: 1.0                   # température du softmax contrarian
    vol_win: 30
    target_vol_annual: 0.30     # 2026-06-21 monté 0,20→0,30 (+50% expo, maxDD backtest ~4%→~6%,
                                # toujours bas). Bonus : positions plus grosses → plus de coins
                                # au-dessus du min HL $10 à basse equity. Levier = choix tolérance DD.
    scalar_cap: 3.0
    max_gross_frac: 0.60
    refresh_sec: 1800
    min_notional_usdc: 10.0
    candle_limit: 600           # besoin = lookback max 200 + L 90 + marge

# ─── Paths ────────────────────────────────────────────────────────────────────
paths:
  data_historical: data/historical
  memory: memory
  logs: logs
