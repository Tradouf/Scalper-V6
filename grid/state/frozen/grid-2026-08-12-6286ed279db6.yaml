# GridAgent — configuration (SPEC §11).
#
# Candidat n°2 du registre des hypothèses (`hypotheses/REGISTRY.md`).
# Seuil placebo applicable : α = 0,025 (Bonferroni, n = 2), 40 tirages minimum.
#
# Rappel du §0, à garder en tête en lisant ces valeurs : une grille est une
# stratégie SHORT-VOLATILITÉ. Elle encaisse de petits gains fréquents tant que
# le range tient, et subit sa perte maximale quand il casse. Il n'existe pas de
# grille gagnante par construction — l'edge, s'il existe, tient à trois choses :
# ne tourner qu'en RANGE (§2), un espacement qui couvre largement les frais
# (§3.2), et une sortie non négociable à la cassure (§6.1).
#
# Les clés marquées [hors-spec] n'apparaissent pas au §11 mais sont exigées par
# le texte ailleurs, ou sans valeur par défaut possible.

grid:
  symbol: BTC

  activation:
    confirm_bars_1h: 3
    adx_max: 20
    atr_percentile_range: [15, 60]
    min_range_atr: 4
    min_levels: 6
    funding_max_annualized: 0.30

  build:
    range_lookback_bars_15m: 384
    k_step: 0.35
    grid_edge_multiple: 5
    max_levels: 20
    max_grid_loss_pct: 0.015
    max_net_exposure_frac: 0.60
    # [hors-spec] Frais maker du compte, en fraction du notionnel. Le §3.2 veut
    # les lire via l'API au démarrage (tier + réduction staking) ; aucun compte
    # n'est attaché au backtest, donc cette valeur sert de substitut et le point
    # de lecture API reste pour le live. Alignée sur xsmom/paper.py.
    maker_fee: 0.00015
    # [hors-spec] Frais taker, utilisés UNIQUEMENT au flatten d'urgence §6.1.
    taker_fee: 0.00045
    tick_size: 1.0                # [hors-spec] pas de cotation BTC-PERP

  funding_skew:
    enabled: false
    threshold_annualized: 0.15
    skew_ticks: 0                 # [hors-spec] désactivé par défaut (§4)

  execution:
    post_only: true
    manage_tick_s: 30
    requote_attempts: 3

  exits:
    k_breakout_atr15m: 0.5
    flatten_timeout_s: 60
    breakout_cooldown_h: 12
    breakout_handoff: true        # soumis à validation A/B (§9.5)
    handoff_stop_k_atr: 1.0
    # [hors-spec] Plafond de la position transférée au TrailingStopAgent (§6.1
    # étape 2). Le §6.1 renvoie au `max_position_usd` du ConfluenceAgent ; on le
    # reprend ici pour que le gel de la config grille couvre aussi cette valeur.
    handoff_max_position_usd: 50000

  # Critères d'acceptation §9.4 — SPÉCIFIQUES à la grille, et différents de ceux
  # du ConfluenceAgent : le seuil de PF est plus bas (1,2 contre 1,3), celui des
  # frais plus haut (20 % contre 15 %), et la significativité se compte en
  # SESSIONS de grille, pas en trades — un cycle de grille n'est pas un pari
  # indépendant, une session l'est.
  acceptance:
    min_profit_factor_oos: 1.2
    max_session_loss_multiple: 1.1   # perte max d'une session ≤ 1,1 × max_grid_loss_pct
    max_fee_ratio: 0.20
    min_sessions: 30

  backtest:
    history_days: 1100
    slippage_bps_market: 2.0      # sorties market d'urgence uniquement
    placebo:
      n_draws: 40                 # ≥ 1/α avec α = 0,025 (registre, n = 2)
      alpha: 0.025
    sensitivity:
      params: ["build.k_step", "build.grid_edge_multiple", "exits.k_breakout_atr15m"]
      deltas: [-0.2, 0.2]
